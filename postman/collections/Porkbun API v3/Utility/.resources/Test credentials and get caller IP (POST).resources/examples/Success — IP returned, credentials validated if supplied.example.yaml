$kind: http-example
request:
  url: "{{baseUrl}}/ping"
  method: POST
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "apikey": "string",
        "secretapikey": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "yourIp": "1.2.3.4",
        "xForwardedFor": "1.2.3.4",
        "credentialsValid": false,
        "account": "string",
        "scopes": [
          "read",
          "dns"
        ]
      }
order: 1000
