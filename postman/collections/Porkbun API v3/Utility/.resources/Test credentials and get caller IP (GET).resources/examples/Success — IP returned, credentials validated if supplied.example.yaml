$kind: http-example
request:
  url: "{{baseUrl}}/ping"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-API-Key
      value: string
      disabled: false
      description: API key header auth (use with X-Secret-API-Key)
    - key: X-Secret-API-Key
      value: string
      disabled: false
      description: Secret API key header auth (use with X-API-Key)
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "yourIp": "1.2.3.4",
        "xForwardedFor": "1.2.3.4",
        "credentialsValid": false,
        "account": "string",
        "scopes": [
          "read",
          "dns"
        ]
      }
order: 1000
