$kind: http-example
request:
  url: "{{baseUrl}}/ip"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "yourIp": "1.2.3.4",
        "xForwardedFor": "1.2.3.4"
      }
order: 1000
