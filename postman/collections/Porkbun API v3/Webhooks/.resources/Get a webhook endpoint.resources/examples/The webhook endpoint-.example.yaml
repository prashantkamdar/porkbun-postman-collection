$kind: http-example
name: The webhook endpoint.
request:
  url: "{{baseUrl}}/webhook/get/:id"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-API-Key
      value: string
      disabled: false
      description: API key header auth (use with X-Secret-API-Key)
    - key: X-Secret-API-Key
      value: string
      disabled: false
      description: Secret API key header auth (use with X-API-Key)
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "42"
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Requests allowed per window for this API key (the general per-key limiter).
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Requests left in the current window for this API key.
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Seconds until the current window resets.
    - key: X-RateLimit-Window
      value: "2951"
      disabled: false
      description: Window length in seconds.
    - key: X-RateLimit-Mode
      value: observe
      disabled: false
      description: "`observe` while the general per-key limiter only measures and refuses nothing. Endpoint-specific limits (availability checks, registrations, renewals and others) are enforced regardless, with 429 and Retry-After."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "endpoint": {
          "id": 42,
          "url": "https://example.com/porkbun/webhook",
          "secret": "9f86d081...",
          "events": [
            "domain.registered",
            "dns.*"
          ],
          "status": "ACTIVE",
          "consecutiveFailures": 0,
          "lastSuccessDate": "2026-06-17 18:30:00",
          "lastFailureDate": "string",
          "lastError": "string",
          "createDate": "2026-06-17 12:00:00"
        }
      }
order: 1000
