  ### v3.59

  - **The spec declares retries and rate limits per operation.** Every authenticated POST lists the optional `Idempotency-Key` header (`components.parameters.IdempotencyKey`), every authenticated operation lists its 429 response with `Retry-After`, and success responses list the `X-RateLimit-*` headers, so tools generated from the spec know which calls are safe to retry and how to back off. Behaviour is unchanged.
  - **Email hosting mailboxes.** `GET /email/getMailboxes/{domain}` lists them (with the price and mail client settings), `POST /email/setupMailbox/{domain}` gives a waiting mailbox (already paid for, or the free trial) its address and password for free, and `POST /email/createMailbox/{domain}` buys one ($36.00 a year) and sets it up in one call, paid from credit or with `payWith`. `POST /email/renewMailbox/{domain}` adds a year now (set-up mailboxes also renew on their own when due; `getMailboxes` shows `autoRenews` and `renewalPrice`). A password is generated and returned once unless one is sent. Mail DNS is set up as for forwarding, asking before replacing another mail service (`DNS_CHANGE_CONFIRMATION_REQUIRED`). Same rules as the website: verified account, address rules, no address both a mailbox and a forward, no purchase for new accounts that paid in crypto. Not available on sandbox keys.
  - **API registrations get the free email hosting trial,** a mailbox waiting to be set up, like registrations on the website.

