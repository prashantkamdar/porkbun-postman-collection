  ### v3.55

  - **Pay for a purchase by card, with a real hold.** `"payWith": "card"` on `/domain/create`, `/domain/renew`, `/domain/transfer`, `/closeout/buy` or a paid `/hosting/create` answers HTTP 402 `PAYMENT_REQUIRED` with `method: "card"`, a single-use `payUrl` and a `cardPaymentId`; nothing is charged. Paying the `payUrl` over MPP with a Stripe Link agent wallet (the person approves in Link) **authorizes** the card for the exact price: a hold, not a charge. Repeat the purchase with `cardPaymentId`: if it succeeds the hold is captured, and if it fails the hold is released and nothing is charged. A hold nobody comes back for is released after an hour, and one whose repeat is refused for a reason a retry cannot fix (the name taken, the price changed, the account blocked) is released at once. No account credit is needed. The response carries `payment` (`paidWith: "card"`, or `charged: false` with `holdReleased` on failure).

  ### v3.54

  - **Pay for a purchase directly in USDC (x402).** Send `"payWith": "usdc"` on `/domain/create`, `/domain/renew`, `/domain/transfer`, `/closeout/buy` or a paid `/hosting/create`. After every normal check passes, the first call answers HTTP 402 (`PAYMENT_REQUIRED`) with Coinbase's x402 terms in the `PAYMENT-REQUIRED` header and charges nothing; an x402 client pays and repeats the same request with `PAYMENT-SIGNATURE`, and the purchase completes in that call, with the receipt in `PAYMENT-RESPONSE` and `payment` in the body. No account credit is needed. If the purchase fails after payment, the payment is kept as account credit, not returned to the wallet (`payment.keptAsCredit: true`, with `balance_cents`). The monthly spend limit is checked before any charge. A 402 releases its `Idempotency-Key`, so the paid repeat with the same key runs. New codes `PAYMENT_REQUIRED`, `PAYMENT_FAILED`, `PAYMENT_IN_PROGRESS`; new `next_action.type` `pay`.
  - **Pay-then-confirm, for wallets that pay a URL themselves** (a wallet MCP, Coinbase's `awal` CLI, or a person on the Coinbase page): pay the 402's `x402Url` or `payUrl`, then repeat the purchase with `"usdcCheckoutId"`. The API checks the checkout is this account's, for this exact purchase and price, paid and unused, then completes the purchase. New codes `PAYMENT_PENDING`, `PAYMENT_MISMATCH`, `PAYMENT_NOT_FOUND`, `PAYMENT_ALREADY_USED`, `PAYMENT_EXPIRED`. A paid purchase checkout nobody claims within an hour is added to the account's credit.

  ### v3.53

  - **Sustained bulk checking is throttled.** An account checking about 1,800 names over three hours while registering fewer than one domain per 200 names checked gets 50 names per 5 minutes for the next 24 hours, on `/domain/checkDomain` (single and bulk) and the older v2 and reseller check endpoints alike (`RATE_LIMIT_EXCEEDED`, `reason: "SUSTAINED_BULK_CHECKING"`, `retryAfter`). Ordinary checking is untouched; accounts with 100+ registrations a year, active affiliates and per-key limits set by support are exempt.
  - **One monthly limit on everything the API does with money.** The account's monthly spend limit now covers every API purchase (registrations, renewals, transfers, closeouts and paid hosting) and, counted separately against the same figure, all credit added over the API: card top-ups, auto top-ups set off by an API purchase, MPP and USDC. Closeouts and paid hosting were checked against the limit but never counted toward it; they now do.
  - **A $100/month default for accounts that have not set a limit.** It applies to purchases as well as top-ups now. Accounts that bought over the API before 2026-10-03 keep no default on purchases. `GET /account/apiSettings` returns `spendLimit` (`limit`, `source`: `account`, `default` or `none`, `spent`, `remaining`) and `topupLimit` (`limit`, `source`, `added`), the limits actually enforced.
