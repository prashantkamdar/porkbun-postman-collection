  - **Email forwarding.** `GET /email/getForwards/{domain}`, `POST /email/addForward/{domain}` and `POST /email/deleteForward/{domain}` manage forwards (an address at the domain delivered to another mailbox), with the same rules as the website: free up to the domain's limit, no catch-all, not on an address that is an email hosting mailbox. Adding the first forward sets up Porkbun's MX and SPF at the apex; when that would delete another mail service's MX records or rewrite an SPF record, it is refused with `DNS_CHANGE_CONFIRMATION_REQUIRED` and a `dnsChanges` description until resent with `confirmDnsChanges: true`. Deleting the last forward removes those records. Not available on sandbox keys.
