  - **Permission scopes on API keys.** A key can be limited to `read` (see everything, change nothing), or to any of `dns`, `domains`, `email`, `hosting`, `purchase`, `funding` and `account` on top of it; "Manage, but no purchases" is every scope except `purchase` and `funding`. Existing keys keep full access. Each operation lists the scope it needs in `x-porkbun-scope`; a call outside the key's permissions returns 403 `INSUFFICIENT_SCOPE` with `requiredScope` and `keyScopes`, and nothing changes. A dry run of a purchase or top-up needs only `read`. `/ping` returns the key's `scopes`. Set them in API Access on porkbun.com.
