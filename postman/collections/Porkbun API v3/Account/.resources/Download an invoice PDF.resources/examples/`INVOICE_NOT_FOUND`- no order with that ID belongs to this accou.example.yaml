$kind: http-example
name: "`INVOICE_NOT_FOUND`: no order with that ID belongs to this account."
request:
  url: "{{baseUrl}}/account/invoicePdf/:orderId"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-API-Key
      value: string
      disabled: false
      description: API key header auth (use with X-Secret-API-Key)
    - key: X-Secret-API-Key
      value: string
      disabled: false
      description: Secret API key header auth (use with X-API-Key)
  pathVariables:
    - key: orderId
      value: "2951"
      disabled: false
      description: (Required) Invoice (order) ID, from `GET /account/invoices`.
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
