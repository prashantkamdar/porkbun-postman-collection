$kind: http-example
name: The invoice.
request:
  url: "{{baseUrl}}/account/invoice/:orderId"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-API-Key
      value: string
      disabled: false
      description: API key header auth (use with X-Secret-API-Key)
    - key: X-Secret-API-Key
      value: string
      disabled: false
      description: Secret API key header auth (use with X-API-Key)
    - key: Accept
      value: application/json
  pathVariables:
    - key: orderId
      value: "2951"
      disabled: false
      description: (Required) Invoice (order) ID, from `GET /account/invoices`.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Requests allowed per window for this API key (the general per-key limiter).
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Requests left in the current window for this API key.
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Seconds until the current window resets.
    - key: X-RateLimit-Window
      value: "2951"
      disabled: false
      description: Window length in seconds.
    - key: X-RateLimit-Mode
      value: observe
      disabled: false
      description: "`observe` while the general per-key limiter only measures and refuses nothing. Endpoint-specific limits (availability checks, registrations, renewals and others) are enforced regardless, with 429 and Retry-After."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "string",
        "invoice": {
          "id": 7922,
          "date": "string",
          "state": "PAID",
          "billTo": {
            "company": "string",
            "name": "string",
            "address": "string",
            "vat": "string"
          },
          "paymentMethods": [
            "Visa ending in 4242"
          ],
          "items": [
            {
              "domain": "string",
              "product": "Domain Registration",
              "type": "string",
              "years": 386,
              "expires": "string",
              "status": "REFUNDED",
              "price_cents": 9912,
              "discount_cents": 9726,
              "tags": [
                "PREMIUM"
              ]
            },
            {
              "domain": "string",
              "product": "Domain Registration",
              "type": "string",
              "years": 6027,
              "expires": "string",
              "status": "COUPON",
              "price_cents": 6118,
