$kind: http-example
name: Authentication failed or token not found / not owned by caller
request:
  url: "{{baseUrl}}/account/inviteStatus?token=string"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-API-Key
      value: string
      disabled: false
      description: (Required) Your API key
    - key: X-Secret-API-Key
      value: string
      disabled: false
      description: (Required) Your secret API key
    - key: Accept
      value: application/json
  queryParams:
    token: string
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "message": "Invalid domain.",
        "code": "INVALID_DOMAIN",
        "account": "string",
        "next_action": {
          "type": "fix_request",
          "hint": "Re-fetch the price via /domain/checkDomain and resend the matching cost.",
          "url": "https://porkbun.com/account/api"
        }
      }
order: 2000
