$kind: http-example
request:
  url: "{{baseUrl}}/apikey/request"
  method: POST
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Acme deploy bot — my-project",
        "codeChallenge": "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM",
        "codeChallengeMethod": "S256",
        "sandbox": false,
        "returnUrl": "https://app.example.com/porkbun/callback",
        "scopes": [
          "dns"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Maximum requests allowed in the window (20)
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Remaining requests in the current window
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Unix timestamp when the window resets
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "requestToken": "string",
        "status": "SUCCESS",
        "authUrl": "https://porkbun.com/account/apiKeyApproval/abc123...",
        "expiration": "2026-03-30 14:30:00",
        "deliveryMode": "legacy",
        "message": "string"
      }
order: 1000
