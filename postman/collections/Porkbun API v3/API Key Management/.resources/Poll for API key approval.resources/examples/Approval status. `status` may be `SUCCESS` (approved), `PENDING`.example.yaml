$kind: http-example
name: Approval status. `status` may be `SUCCESS` (approved), `PENDING` (awaiting user action), or `ERROR` (expired/denied/invalid).
request:
  url: "{{baseUrl}}/apikey/retrieve"
  method: POST
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "requestToken": "b31dbd151ec9213b525ee2f0aab967306fb28b045d881728602a33ea5e8cf36c",
        "codeVerifier": "BayBjrflIAaBayBjrflIAaBayBjrflIAaBayBjrflIAa"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Maximum requests allowed in the window (120)
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Remaining requests in the current window
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Unix timestamp when the window resets
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "apikey": "string",
        "secretapikey": "string",
        "message": "string",
        "code": "string"
      }
order: 1000
