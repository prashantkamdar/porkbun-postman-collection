$kind: http-example
request:
  url: "{{baseUrl}}/apikey/retrieve"
  method: POST
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "requestToken": "b31dbd151ec9213b525ee2f0aab967306fb28b045d881728602a33ea5e8cf36c",
        "codeVerifier": "BayBjrflIAaBayBjrflIAaBayBjrflIAaBayBjrflIAa"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Retry-After
      value: "2951"
      disabled: false
      description: "On 429: whole seconds to wait before retrying."
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Requests allowed per window for this API key (the general per-key limiter).
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Requests left in the current window for this API key.
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Seconds until the current window resets.
    - key: X-RateLimit-Window
      value: "2951"
      disabled: false
      description: Window length in seconds.
    - key: X-RateLimit-Mode
      value: observe
      disabled: false
      description: "`observe` while the general per-key limiter only measures and refuses nothing. Endpoint-specific limits (availability checks, registrations, renewals and others) are enforced regardless, with 429 and Retry-After."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "message": "Rate limit exceeded. Please try again later.",
        "code": "RATE_LIMIT_EXCEEDED",
        "ttlRemaining": 7212
      }
order: 4000
