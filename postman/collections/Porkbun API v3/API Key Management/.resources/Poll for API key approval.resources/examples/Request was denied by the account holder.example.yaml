$kind: http-example
request:
  url: "{{baseUrl}}/apikey/retrieve"
  method: POST
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "requestToken": "b31dbd151ec9213b525ee2f0aab967306fb28b045d881728602a33ea5e8cf36c",
        "codeVerifier": "BayBjrflIAaBayBjrflIAaBayBjrflIAaBayBjrflIAa"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "message": "Invalid domain.",
        "code": "INVALID_DOMAIN",
        "account": "string",
        "next_action": {
          "type": "fix_request",
          "hint": "Re-fetch the price via /domain/checkDomain and resend the matching cost.",
          "url": "https://porkbun.com/account/api"
        }
      }
order: 3000
