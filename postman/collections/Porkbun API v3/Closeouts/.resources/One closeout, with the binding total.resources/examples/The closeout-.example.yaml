$kind: http-example
name: The closeout.
request:
  url: "{{baseUrl}}/closeout/get/:domain"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: domain
      value: example.com
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Requests allowed per window for this API key (the general per-key limiter).
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Requests left in the current window for this API key.
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Seconds until the current window resets.
    - key: X-RateLimit-Window
      value: "2951"
      disabled: false
      description: Window length in seconds.
    - key: X-RateLimit-Mode
      value: observe
      disabled: false
      description: "`observe` while the general per-key limiter only measures and refuses nothing. Endpoint-specific limits (availability checks, registrations, renewals and others) are enforced regardless, with 429 and Retry-After."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "string",
        "available": true,
        "closeout": {
          "closeoutId": 5204,
          "domain": "string",
          "tld": "string",
          "price": 9702,
          "providerRenewalPrice": 2968,
          "renewalPrice": 5210,
          "totalPrice": 1646,
          "localDomain": true,
          "age": 7274,
          "registrationDate": "string",
          "endTime": "string",
          "nameLength": 2207,
          "isIdn": true,
          "estibotAppraisal": 1660,
          "monthlyVisitors": 5970,
          "inboundLinks": 1472,
          "expiredRevenue": 9935,
          "otherTldCount": 700
        }
      }
order: 1000
