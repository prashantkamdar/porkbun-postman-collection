$kind: http-example
request:
  url: "{{baseUrl}}/closeout/search?query=invest&tld=org&nameLength=4&ageMin=10&ageMax=30&priceMin=500&priceMax=3000&sortName=registrationDate&sortDirection=asc&start=0&limit=100"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  queryParams:
    query: invest
    tld: org
    nameLength: "4"
    ageMin: "10"
    ageMax: "30"
    priceMin: "500"
    priceMax: "3000"
    sortName: registrationDate
    sortDirection: asc
    start: "0"
    limit: "100"
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "message": "Invalid domain.",
        "code": "INVALID_DOMAIN",
        "account": "string",
        "next_action": {
          "type": "fix_request",
          "hint": "Re-fetch the price via /domain/checkDomain and resend the matching cost.",
          "url": "https://porkbun.com/account/api"
        }
      }
order: 2000
