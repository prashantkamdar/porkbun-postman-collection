$kind: http-request
description: |-
  Create many records in one call, so a domain arriving from another registrar keeps resolving instead of going dark.

  Send `records` to import an exact list — the better path when the old registrar has an API you can read with your own credentials. Omit `records` entirely and whatever `/dns/scan/{domain}` can discover is imported instead.

  **Idempotent.** A record that already exists is counted in `skipped`, not `failed`, so this is safe to re-run and safe to use as a converge step. Records that fail individually are listed in `failures` while the rest still import; the call only errors outright if nothing was importable.

  Imported records do nothing until the domain actually points at the Porkbun nameservers — check `/domain/getNs/{domain}` and set them with `/domain/updateNs/{domain}`. Maximum 500 records per call. Supports `dryRun`.
url: "{{baseUrl}}/dns/import/:domain"
method: POST
headers:
  - key: Idempotency-Key
    value: "{{$guid}}"
    disabled: false
    description: Optional, recommended on every purchase and write. Send a unique value (a UUID) per intended operation. Repeating the request with the same key and an identical body within 24 hours returns the original response instead of doing it again, so a retry after a timeout cannot double-charge or double-apply. The same key with a different body returns 409 IDEMPOTENCY_KEY_MISMATCH; while the first request is still running, 409 IDEMPOTENCY_KEY_IN_USE.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
body:
  type: json
  content: |-
    {
      "records": [
        {
          "name": "www",
          "type": "A",
          "content": "203.0.113.10",
          "ttl": 600,
          "prio": 10
        },
        {
          "name": "www",
          "type": "A",
          "content": "203.0.113.10",
          "ttl": 600,
          "prio": 10
        }
      ]
    }
settings: {}
examples: ./.resources/Bulk-create DNS records (transfer restore).resources/examples
order: 6000
