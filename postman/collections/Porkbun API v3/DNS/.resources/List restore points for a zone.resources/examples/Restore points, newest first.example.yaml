$kind: http-example
request:
  url: "{{baseUrl}}/dns/history/:domain"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: domain
      value: example.com
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "apikey": "pk1_...",
        "secretapikey": "sk1_..."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Requests allowed per window for this API key (the general per-key limiter).
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Requests left in the current window for this API key.
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Seconds until the current window resets.
    - key: X-RateLimit-Window
      value: "2951"
      disabled: false
      description: Window length in seconds.
    - key: X-RateLimit-Mode
      value: observe
      disabled: false
      description: "`observe` while the general per-key limiter only measures and refuses nothing. Endpoint-specific limits (availability checks, registrations, renewals and others) are enforced regardless, with 429 and Retry-After."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "domain": "example.com",
        "restorePoints": [
          {
            "id": 1234,
            "takenAt": "2026-09-16 22:14:19",
            "reason": "before-edit",
            "source": "auto",
            "recordCount": 9,
            "matchesLive": false
          },
          {
            "id": 1234,
            "takenAt": "2026-09-16 22:14:19",
            "reason": "before-edit",
            "source": "auto",
            "recordCount": 9,
            "matchesLive": false
          }
        ]
      }
order: 1000
