$kind: http-request
description: "Delete a DNSSEC record from the registry by key tag. Note: most registries delete all records matching the key data, not only the record with the specified key tag."
url: "{{baseUrl}}/dns/deleteDnssecRecord/:domain/:keytag"
method: POST
headers:
  - key: Idempotency-Key
    value: "{{$guid}}"
    disabled: false
    description: Optional, recommended on every purchase and write. Send a unique value (a UUID) per intended operation. Repeating the request with the same key and an identical body within 24 hours returns the original response instead of doing it again, so a retry after a timeout cannot double-charge or double-apply. The same key with a different body returns 409 IDEMPOTENCY_KEY_MISMATCH; while the first request is still running, 409 IDEMPOTENCY_KEY_IN_USE.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
  - key: keytag
    value: "12345"
    disabled: false
    description: (Required) The DNSSEC key tag value
body:
  type: json
  content: "{}"
settings: {}
examples: ./.resources/Delete DNSSEC record.resources/examples
order: 15000
