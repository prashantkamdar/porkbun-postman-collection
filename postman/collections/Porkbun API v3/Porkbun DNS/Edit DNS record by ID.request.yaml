$kind: http-request
description: 'Edit a specific DNS record by its numeric ID. Send only the fields you want to change: any field left out keeps its current value (send `"name": ""` to move the record to the apex). SOA and default Porkbun NS records cannot be edited.'
url: "{{baseUrl}}/dns/edit/:domain/:id"
method: POST
headers:
  - key: Idempotency-Key
    value: "{{$guid}}"
    disabled: false
    description: Optional, recommended on every purchase and write. Send a unique value (a UUID) per intended operation. Repeating the request with the same key and an identical body within 24 hours returns the original response instead of doing it again, so a retry after a timeout cannot double-charge or double-apply. The same key with a different body returns 409 IDEMPOTENCY_KEY_MISMATCH; while the first request is still running, 409 IDEMPOTENCY_KEY_IN_USE.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
  - key: id
    value: "123456789"
    disabled: false
    description: (Required) Numeric DNS record ID
body:
  type: json
  content: |-
    {
      "name": "string",
      "type": "A",
      "content": "5.6.7.8",
      "ttl": 4781,
      "prio": 4190,
      "notes": "string"
    }
settings: {}
examples: ./.resources/Edit DNS record by ID.resources/examples
order: 8000
