$kind: http-example
request:
  url: "{{baseUrl}}/aftermarket/search?query=coffee&tld=com&saleType=make_offer&priceMin=10000&priceMax=500000&limit=50"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  queryParams:
    query: coffee
    tld: com
    saleType: make_offer
    priceMin: "10000"
    priceMax: "500000"
    limit: "50"
  body:
    type: text
    content: ""
response:
  statusCode: 502
  statusText: Bad Gateway
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "message": "Invalid domain.",
        "code": "INVALID_DOMAIN",
        "account": "string",
        "next_action": {
          "type": "fix_request",
          "hint": "Re-fetch the price via /domain/checkDomain and resend the matching cost.",
          "url": "https://porkbun.com/account/api"
        }
      }
order: 4000
