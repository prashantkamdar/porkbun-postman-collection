$kind: http-example
name: "`INVALID_TLD`: a filter was given and none of the requested TLDs is sold. The message names them."
request:
  url: "{{baseUrl}}/pricing/get?tld=io&tlds=com,io,dev"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  queryParams:
    tld: io
    tlds: com,io,dev
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "message": "Invalid domain.",
        "code": "INVALID_DOMAIN",
        "account": "string",
        "next_action": {
          "type": "fix_request",
          "hint": "Re-fetch the price via /domain/checkDomain and resend the matching cost.",
          "url": "https://porkbun.com/account/api"
        }
      }
order: 2000
