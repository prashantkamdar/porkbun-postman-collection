$kind: http-request
description: Retrieve the Let's Encrypt SSL certificate bundle for a domain. The certificate must already be issued (status HAVECERT). Token-based access is not supported for this endpoint. Supports both GET (with header auth) and POST (with body or header auth).
url: "{{baseUrl}}/ssl/retrieve/:domain"
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
settings: {}
examples: ./.resources/Retrieve SSL bundle (GET).resources/examples
order: 2000
