$kind: http-request
description: |-
  **Applies to:** Cloud for WordPress only.

  Lists the application passwords on the site (uuid, name, created, last used) so you can audit or pick one to revoke. Metadata only — WordPress stores just a hash, so a password can never be re-read. Optional `wpUser` (defaults to the dedicated `porkbun-agent` user).

  Free preview sites are excluded (`PREVIEW_SITE_NOT_SUPPORTED`).
url: "{{baseUrl}}/hosting/getWpCredentials/:domain?wpUser=porkbun-agent"
method: GET
headers:
  - key: Accept
    value: application/json
queryParams:
  wpUser: porkbun-agent
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
settings: {}
examples: ./.resources/List WordPress application passwords (WordPress only).resources/examples
order: 10000
