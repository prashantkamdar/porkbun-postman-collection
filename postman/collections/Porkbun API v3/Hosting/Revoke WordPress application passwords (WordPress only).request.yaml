$kind: http-request
description: |-
  **Applies to:** Cloud for WordPress only.

  Revokes an application password by `uuid` (from `/hosting/getWpCredentials`), or every one for the user with `all: true`. Any integration using it stops authenticating immediately.

  Free preview sites are excluded (`PREVIEW_SITE_NOT_SUPPORTED`).
url: "{{baseUrl}}/hosting/deleteWpCredentials/:domain"
method: POST
headers:
  - key: Idempotency-Key
    value: "{{$guid}}"
    disabled: false
    description: Optional, recommended on every purchase and write. Send a unique value (a UUID) per intended operation. Repeating the request with the same key and an identical body within 24 hours returns the original response instead of doing it again, so a retry after a timeout cannot double-charge or double-apply. The same key with a different body returns 409 IDEMPOTENCY_KEY_MISMATCH; while the first request is still running, 409 IDEMPOTENCY_KEY_IN_USE.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
body:
  type: json
  content: |-
    {
      "uuid": "string",
      "all": false,
      "wpUser": "porkbun-agent",
      "dryRun": false
    }
settings: {}
examples: ./.resources/Revoke WordPress application passwords (WordPress only).resources/examples
order: 11000
