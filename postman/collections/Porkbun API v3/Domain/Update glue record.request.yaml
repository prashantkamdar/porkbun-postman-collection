$kind: http-request
description: Update the IP addresses of a glue record. All existing IP addresses are replaced with the supplied list.
url: "{{baseUrl}}/domain/updateGlue/:domain/:subdomain"
method: POST
headers:
  - key: Idempotency-Key
    value: "{{$guid}}"
    disabled: false
    description: Optional, recommended on every purchase and write. Send a unique value (a UUID) per intended operation. Repeating the request with the same key and an identical body within 24 hours returns the original response instead of doing it again, so a retry after a timeout cannot double-charge or double-apply. The same key with a different body returns 409 IDEMPOTENCY_KEY_MISMATCH; while the first request is still running, 409 IDEMPOTENCY_KEY_IN_USE.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
  - key: subdomain
    value: ns1
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "ips": [
        "1.2.3.4",
        "2001:db8::1"
      ]
    }
settings: {}
examples: ./.resources/Update glue record.resources/examples
order: 23000
