$kind: http-request
description: Retrieve all active URL forwards for a domain. Supports both GET (with header auth) and POST (with body or header auth).
url: "{{baseUrl}}/domain/getUrlForwarding/:domain"
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
settings: {}
examples: ./.resources/List URL forwards (GET).resources/examples
order: 26000
