$kind: http-request
description: Update the auto-renew setting for one or more domains. The domain can be passed in the URL path or in the `domains` array in the request body (or both). Both are combined and deduplicated.
url: "{{baseUrl}}/domain/updateAutoRenew/:domain"
method: POST
headers:
  - key: Idempotency-Key
    value: "{{$guid}}"
    disabled: false
    description: Optional, recommended on every purchase and write. Send a unique value (a UUID) per intended operation. Repeating the request with the same key and an identical body within 24 hours returns the original response instead of doing it again, so a retry after a timeout cannot double-charge or double-apply. The same key with a different body returns 409 IDEMPOTENCY_KEY_MISMATCH; while the first request is still running, 409 IDEMPOTENCY_KEY_IN_USE.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: Optional single domain in URL. Omit or use `/domain/updateAutoRenew/` (without trailing domain) when using the `domains` body array instead.
body:
  type: json
  content: |-
    {
      "status": "on",
      "domains": [
        "string",
        "string"
      ]
    }
settings: {}
examples: ./.resources/Update auto-renew setting.resources/examples
order: 16000
