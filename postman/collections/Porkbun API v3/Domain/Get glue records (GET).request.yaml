$kind: http-request
description: Retrieve all glue records (host objects) registered under the domain. Supports both GET (with header auth) and POST (with body or header auth).
url: "{{baseUrl}}/domain/getGlue/:domain"
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: domain
    value: example.com
    disabled: false
    description: (Required) Domain name, e.g. example.com
settings: {}
examples: ./.resources/Get glue records (GET).resources/examples
order: 21000
