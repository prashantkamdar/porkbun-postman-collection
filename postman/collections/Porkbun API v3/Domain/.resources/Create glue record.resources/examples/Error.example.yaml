$kind: http-example
request:
  url: "{{baseUrl}}/domain/createGlue/:domain/:subdomain"
  method: POST
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Idempotency-Key
      value: 3f0c9a52-6d1e-4c8e-9b7a-2f5d1e0c4a11
      disabled: false
      description: Optional, recommended on every purchase and write. Send a unique value (a UUID) per intended operation. Repeating the request with the same key and an identical body within 24 hours returns the original response instead of doing it again, so a retry after a timeout cannot double-charge or double-apply. The same key with a different body returns 409 IDEMPOTENCY_KEY_MISMATCH; while the first request is still running, 409 IDEMPOTENCY_KEY_IN_USE.
    - key: Accept
      value: application/json
  pathVariables:
    - key: domain
      value: example.com
      disabled: false
      description: "(Required) "
    - key: subdomain
      value: ns1
      disabled: false
      description: (Required) The subdomain portion only (e.g. 'ns1' for ns1.example.com)
  body:
    type: json
    content: |-
      {
        "apikey": "string",
        "secretapikey": "string",
        "ips": [
          "1.2.3.4",
          "2001:db8::1"
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "message": "Invalid domain.",
        "code": "INVALID_DOMAIN",
        "account": "string",
        "next_action": {
          "type": "fix_request",
          "hint": "Re-fetch the price via /domain/checkDomain and resend the matching cost.",
          "url": "https://porkbun.com/account/api"
        }
      }
order: 2000
