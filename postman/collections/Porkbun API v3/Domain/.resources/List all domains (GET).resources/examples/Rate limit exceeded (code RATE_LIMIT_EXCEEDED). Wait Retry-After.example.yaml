$kind: http-example
name: Rate limit exceeded (code RATE_LIMIT_EXCEEDED). Wait Retry-After seconds, then retry the same request.
request:
  url: "{{baseUrl}}/domain/listAll?start=0&includeLabels=no&domain=string&nameContains=string&expiringWithinDays=2951&tlds=string&tlds=string&autoRenew=no&apiAccess=no&sortName=domain&sortDirection=asc"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-API-Key
      value: string
      disabled: false
      description: API key header auth (use with X-Secret-API-Key)
    - key: X-Secret-API-Key
      value: string
      disabled: false
      description: Secret API key header auth (use with X-API-Key)
    - key: Accept
      value: application/json
  queryParams:
    - key: start
      value: "0"
    - key: includeLabels
      value: no
    - key: domain
      value: string
    - key: nameContains
      value: string
    - key: expiringWithinDays
      value: "2951"
    - key: tlds
      value: string
    - key: tlds
      value: string
    - key: autoRenew
      value: no
    - key: apiAccess
      value: no
    - key: sortName
      value: domain
    - key: sortDirection
      value: asc
  body:
    type: text
    content: ""
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Retry-After
      value: "2951"
      disabled: false
      description: "On 429: whole seconds to wait before retrying."
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Requests allowed per window for this API key (the general per-key limiter).
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Requests left in the current window for this API key.
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Seconds until the current window resets.
    - key: X-RateLimit-Window
      value: "2951"
      disabled: false
      description: Window length in seconds.
    - key: X-RateLimit-Mode
      value: observe
      disabled: false
      description: "`observe` while the general per-key limiter only measures and refuses nothing. Endpoint-specific limits (availability checks, registrations, renewals and others) are enforced regardless, with 429 and Retry-After."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "ERROR",
        "message": "Rate limit exceeded. Please try again later.",
        "code": "RATE_LIMIT_EXCEEDED",
        "ttlRemaining": 7212
      }
order: 3000
