$kind: http-example
name: Registration requirements for the TLD.
request:
  url: "{{baseUrl}}/domain/getRegistrationRequirements/:tld"
  method: GET
  headers:
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-API-Key
      value: string
      disabled: false
      description: API key header auth (use with X-Secret-API-Key)
    - key: X-Secret-API-Key
      value: string
      disabled: false
      description: Secret API key header auth (use with X-API-Key)
    - key: Accept
      value: application/json
  pathVariables:
    - key: tld
      value: us
      disabled: false
      description: (Required) TLD without a leading dot, e.g. `com`, `us`, `ca`.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-RateLimit-Limit
      value: "2951"
      disabled: false
      description: Requests allowed per window for this API key (the general per-key limiter).
    - key: X-RateLimit-Remaining
      value: "2951"
      disabled: false
      description: Requests left in the current window for this API key.
    - key: X-RateLimit-Reset
      value: "2951"
      disabled: false
      description: Seconds until the current window resets.
    - key: X-RateLimit-Window
      value: "2951"
      disabled: false
      description: Window length in seconds.
    - key: X-RateLimit-Mode
      value: observe
      disabled: false
      description: "`observe` while the general per-key limiter only measures and refuses nothing. Endpoint-specific limits (availability checks, registrations, renewals and others) are enforced regardless, with 429 and Retry-After."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "SUCCESS",
        "tld": "us",
        "apiRegisterable": false,
        "registrationDurationYears": 1,
        "maxRegistrationYears": 4229,
        "whoisPrivacySupported": true,
        "requiresValidatedAddress": true,
        "registrantOnly": false,
        "requestSchema": {
          "$schema": "https://json-schema.org/draft/2020-12/schema",
          "title": "domain/create request for .com",
          "type": "object",
          "required": [
            "apikey",
            "secretapikey",
            "cost",
            "agreeToTerms"
          ],
          "additionalProperties": false,
          "properties": {
            "apikey": {
              "type": "string",
              "description": "Public API key (pk1_...). Omit if using the X-API-Key header."
            },
            "secretapikey": {
              "type": "string",
              "description": "Secret API key (sk1_...). Omit if using the X-Secret-API-Key header."
            },
            "cost": {
              "type": "integer",
              "minimum": 0,
              "description": "Total price in US cents; must match the quote from /domain/checkDomain."
            },
            "agreeToTerms": {
              "type": "string",
              "enum": [
                "yes",
                "1"
              ],
              "description": "Must be \"yes\" to accept the registration agreement and terms."
            },
            "whoisPrivacy": {
              "type": "string",
              "enum": [
                "yes",
                "no"
              ],
              "description": "Optional WHOIS privacy override; defaults to enabled where supported."
            }
          }
        },
        "registryRequirements": {
          "$schema": "https://json-schema.org/draft/2020-12/schema",
          "title": "Registry eligibility data for .us",
          "description": "Extra registrant data the registry requires for this TLD. These fields are not accepted by /domain/create today (such TLDs are website-only); this schema documents the requirements.",
          "type": "object",
          "properties": {
            "purpose": {
              "type": "string",
              "title": "Purpose",
              "x-appliesTo": "registrant contact",
              "enum": [
                "P1",
                "P2",
                "P3",
                "P4",
                "P5"
              ],
              "x-enumDescriptions": {
                "P1": "Business use for profit.",
                "P2": "Non-profit organization.",
                "P3": "Personal use.",
                "P4": "Education purposes.",
                "P5": "Government purposes."
              }
            },
            "category": {
              "type": "string",
              "title": "Category",
              "x-appliesTo": "registrant contact",
              "enum": [
                "C11",
                "C12",
                "C21",
                "C31",
                "C32"
              ],
              "x-enumDescriptions": {
                "C11": "A US citizen.",
                "C12": "A permanent resident of the US.",
                "C21": "A US-based organization or company.",
                "C31": "A foreign entity with a bona fide US presence.",
                "C32": "An entity with a US office or facility."
              }
            }
          },
          "x-policyNote": "To register a .us domain you must accurately complete the Purpose and Category fields; inaccurate information can lead to seizure without refund."
        },
        "notApiRegisterableReason": "string"
      }
order: 1000
